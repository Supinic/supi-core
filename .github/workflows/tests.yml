name: Automated tests + lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Enable Corepack
      run: corepack enable

    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'yarn'

    - name: Prepare Yarn packages
      run: yarn

    - name: Run tests
      run: yarn test

    - name: Run lint:fix
      run: yarn lint:fix
